services:

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: bhai-app

    ports:
      - "8000:8000"

    depends_on:
      - rabbitmq

    environment:
      RABBITMQ_URL: amqp://dev:devpassword@rabbitmq:5672


  rabbitmq:
    image: rabbitmq:4-management

    container_name: bhai-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: devpassword

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


volumes:
  rabbitmq_data: